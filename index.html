:root{
  --bg:#E4E9ED; --panel:#FFFFFF; --ink:#101F29; --muted:#4A5D6A; --line:#B4C0C8;
  --head-bg:#0B4F6C; --head-bg2:#062F41; --sec-head:#DAE5EB; --brand:#0B4F6C; --brand-text:#0B4F6C; --on-brand:#FFFFFF;
  --amber:#F5A800;
  --in-bg:#FFF6CC; --in-ink:#0A3A9C; --in-line:#D3BB55;
  --ok:#16793B; --ok-bg:#D9F1E2; --warn:#8F5200; --warn-bg:#FFE9BF; --bad:#B01919; --bad-bg:#F9D8D8;
  --info-bg:#DAEAF2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1820; --panel:#15242D; --ink:#E6EEF2; --muted:#9BAFBB; --line:#2E4350;
    --head-bg:#0A2A38; --head-bg2:#04141B; --sec-head:#1B2F3A; --brand:#1F7DA6; --brand-text:#74C6EA; --on-brand:#FFFFFF;
    --in-bg:#3A3413; --in-ink:#A9C8FF; --in-line:#6E6122;
    --ok:#52D384; --ok-bg:#12331F; --warn:#FFBE55; --warn-bg:#3A2A0A; --bad:#FF8383; --bad-bg:#3E1515;
    --info-bg:#12303E;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1820; --panel:#15242D; --ink:#E6EEF2; --muted:#9BAFBB; --line:#2E4350;
  --head-bg:#0A2A38; --head-bg2:#04141B; --sec-head:#1B2F3A; --brand:#1F7DA6; --brand-text:#74C6EA; --on-brand:#FFFFFF;
  --in-bg:#3A3413; --in-ink:#A9C8FF; --in-line:#6E6122;
  --ok:#52D384; --ok-bg:#12331F; --warn:#FFBE55; --warn-bg:#3A2A0A; --bad:#FF8383; --bad-bg:#3E1515;
  --info-bg:#12303E;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--head-bg); -webkit-text-size-adjust:100%; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font:400 16px/1.42 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; }
button,input,select,textarea{ font-family:inherit; }
h1,h2,h3{ font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; }

/* Barra superior */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:linear-gradient(158deg, var(--head-bg) 0%, var(--head-bg2) 100%); color:#fff;
  display:flex; align-items:center; gap:11px; padding:11px 14px; border-bottom:1px solid rgba(245,168,0,.5);
  box-shadow:0 3px 14px rgba(0,0,0,.32); }
.logo{ width:32px; height:32px; flex:none; stroke:rgba(255,255,255,.92); fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
.logo .needle{ stroke:#fff; }
.logo .hub{ fill:var(--amber); stroke:none; }
.ttl{ flex:1; min-width:0; line-height:1.15; }
.ttl b{ display:block; font:600 19px/1.12 'Barlow Condensed',system-ui,sans-serif; letter-spacing:.1px; }
.ttl small{ display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,.82); }
.ttl small .co{ font-weight:600; margin-right:9px; color:#fff; }
.ttl small .dt{ opacity:.85; }
.chip{ max-width:42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:5px 12px; font:600 14.5px 'Barlow Condensed',system-ui,sans-serif;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }

main{ max-width:640px; margin:0 auto; padding:14px 12px 100px; outline:none; }
h1{ margin:2px 2px 12px; font-size:30px; line-height:1.05; font-weight:700; }
.lead{ margin:-4px 2px 14px; color:var(--muted); font-size:15px; }

/* Secciones tipo planilla */
.sec{ background:var(--panel); border:1px solid var(--line); border-radius:6px; margin:0 0 14px; overflow:hidden; }
.sec>h2{ margin:0; padding:9px 14px; font-size:19px; font-weight:600; background:var(--sec-head);
  border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sec .body{ padding:12px 14px 14px; }
.g2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.g1{ display:grid; gap:12px; }
.span2{ grid-column:1 / -1; }
@media (max-width:340px){ .g2{ grid-template-columns:1fr; } }

/* Campos: amarillo con texto azul = dato a rellenar (igual que la plantilla Excel) */
.f{ display:block; min-width:0; }
.fl{ display:block; font-size:14px; font-weight:500; color:var(--muted); margin:0 0 4px; line-height:1.2; }
.fi{ display:flex; align-items:stretch; border:1.5px solid var(--in-line); background:var(--in-bg); border-radius:5px; min-width:0; }
.fi:focus-within{ outline:3px solid var(--amber); outline-offset:1px; }
.in{ flex:1; min-width:0; width:100%; border:0; background:transparent; color:var(--in-ink);
  font:600 19px/1.1 'Barlow',system-ui,sans-serif; padding:12px 10px; font-variant-numeric:tabular-nums; border-radius:5px; }
.in:focus{ outline:none; }
.in::placeholder{ color:var(--muted); opacity:.55; font-weight:400; }
.selin{ color:var(--ink); font-weight:500; font-size:17px; }
.suf{ align-self:center; padding:0 10px 0 2px; color:var(--muted); font-size:14px; white-space:nowrap; }

ção mostrada é apenas referencial."], "Sobre 300 kW los motores suelen ser de media tensión: no conecte instrumentos por su cuenta. Tome kW, A y cos φ del relé de protección o del medidor de la subestación (TC/TT), o use personal cualificado. Un punto de eficiencia equivale a mucha energía: considere monitoreo permanente.": ["Above 300 kW, motors are usually medium voltage: do not connect instruments on your own. Take kW, A and cos φ from the protection relay or the substation meter (CT/PT), or use qualified personnel. One efficiency point is worth a lot of energy: consider permanent monitoring.", "Acima de 300 kW, os motores costumam ser de média tensão: não conecte instrumentos por conta própria. Obtenha kW, A e cos φ do relé de proteção ou do medidor da subestação (TC/TP), ou use pessoal qualificado. Um ponto de eficiência equivale a muita energia: considere monitoramento permanente."], "Fluido bombeado": ["Pumped fluid", "Fluido bombeado"], "La densidad cambia la altura y la potencia hidráulica; la viscosidad reduce la eficiencia esperada.": ["Density changes the head and hydraulic power; viscosity reduces the expected efficiency.", "A densidade altera a altura e a potência hidráulica; a viscosidade reduz a eficiência esperada."], "Tipo de fluido": ["Fluid type", "Tipo de fluido"], "Agua dulce (~20 °C)": ["Fresh water (~20 °C)", "Água doce (~20 °C)"], "Agua de mar (~20 °C)": ["Seawater (~20 °C)", "Água do mar (~20 °C)"], "Agua producida / salmuera (~60 °C)": ["Produced water / brine (~60 °C)", "Água produzida / salmoura (~60 °C)"], "Crudo ligero (~35 °API, 40 °C)": ["Light crude (~35 °API, 40 °C)", "Petróleo leve (~35 °API, 40 °C)"], "Crudo mediano (~25 °API, 50 °C)": ["Medium crude (~25 °API, 50 °C)", "Petróleo médio (~25 °API, 50 °C)"], "Crudo pesado (~15 °API, 60 °C)": ["Heavy crude (~15 °API, 60 °C)", "Petróleo pesado (~15 °API, 60 °C)"], "Diésel (~20 °C)": ["Diesel (~20 °C)", "Diesel (~20 °C)"], "Queroseno / Jet A-1 (~20 °C)": ["Kerosene / Jet A-1 (~20 °C)" ncia.": ["Fill in at least one point (flow, pressures and power) and the equipment diameters to see the efficiency.", "Preencha pelo menos um ponto (vazão, pressões e potência) e os diâmetros do equipamento para ver a eficiência."], "Peor lectura:": ["Worst reading:", "Pior leitura:"], "Zona A: máquina nueva o recién intervenida": ["Zone A: new or recently serviced machine", "Zona A: máquina nova ou recém-intervencionada"], "Zona B: aceptable para operación continua": ["Zone B: acceptable for continuous operation", "Zona B: aceitável para operação contínua"], "Zona C: no apta para operación continua prolongada": ["Zone C: not suitable for prolonged continuous operation", "Zona C: não apta para operação contínua prolongada"], "Zona D: la vibración puede causar daño": ["Zone D: vibration can cause damage", "Zona D: a vibração pode causar dano"], "límites": ["limits", "limites"], "Punto ": ["Point ", "Ponto "], "por apoyo": ["by support", "por apoio"], "Apoyo": ["Support", "Apoio"], "s/d": ["n/a", "s/d"], "Todos los puntos de la prueba": ["All test points", "Todos os pontos do teste"], "Punto": ["Point", "Ponto"], "Lecturas": ["Readings", "Leituras"], "Máx. (mm/s)": ["Max. (mm/s)", "Máx. (mm/s)"], "Dónde": ["Where", "Onde"], "Estado": ["Status", "Estado"], "Apto = zonas A o B; no apto = zonas C o D. Los valores justo en un límite se clasifican en la zona inferior. Se aplican los mismos límites al eje axial. Confirme con la edición vigente de la norma.": ["Fit = zones A or B; not fit = zones C or D. Values exactly on a boundary are classified in the lower zone. The same limits apply to the axial axis. Confirm with the current edition of the standard.", "Apto = zonas A ou B; não apto = zonas C ou D. Valores exatamente num limite são classificados na zona inferior. Os mesmos limites se aplicam ao eixo axial. Confirme com a edição vigente da norma."], "Hay puntos con menos de 10 posiciones medidas (motor libre 2, motor acople 3, bomba acople 3, bomba libre 2). Lo no medido no se evalúa.": ["Some points have fewer than 10 measured positions (motor free end 2, motor coupling end 3, pump coupling end 3, pump free end 2). What isn't measured isn't evaluated.", "Há pontos com menos de 10 posições medidas (motor livre 2, motor acoplamento 3, bomba acoplamento 3, bomba livre 2). O que não foi medido não é avaliado."], "Ir a puntos de medición": ["Go to measurement points", "Ir para pontos de medição"], "Incertidumbre de los instrumentos": ["Instrument uncertainty", "Incerteza dos instrumentos"], "Caudal (± % de la lectura)": ["Flow (± % of reading)", "Vazão (± % da leitura)"], "Presión (± % del fondo de escala)": ["Pressure (± % of full scale)", "Pressão (± % do fundo de escala)"], "Fondo de escala del manómetro": ["Gauge full scale", "Fundo de escala do manômetro"], "Potencia eléctrica (± %)": ["Electrical power (± %)", "Potência elétrica (± %)"], "Densidad (± %)": ["Density (± %)", "Densidade (± %)"], "η del motor (± puntos)": ["Motor η (± points)", "η do motor (± pontos)"], "Valores típicos: caudalímetro ultrasónico clamp-on 1–3 %, manómetro clase 0.5–1, transmisor 0.1–0.25, analizador de red 0.5–1. La incertidumbre se combina como raíz de la suma de cuadrados.": ["Typical values: clamp-on ultrasonic flow meter 1–3 %, class 0.5–1 gauge, transmitter 0.1–0.25, power analyzer 0.5–1. Uncertainty is combined as the root-sum-of-squares.", "Valores típicos: medidor de vazão ultrassônico clamp-on 1–3 %, manômetro classe 0.5–1, transmissor 0.1–0.25, analisador de rede 0.5–1. A incerteza é combinada como raiz da soma dos quadrados."], "Guía de medición (lista de verificación)": ["Measurement guide (checklist)", "Guia de medição (lista de verificação)"], "A. Preparación y seguridad": ["A. Preparation and safety", "A. Preparação e segurança"], "1. Definir alcance y reunir datos": ["1. Define scope and gather data", "1. Definir escopo e reunir dados"], "TAG, servicio y datos de placa (Q, H, kW, rpm). Curvas del fabricante (H–Q, η–Q, P–Q, NPSHr) y curva de rendimiento del motor.": ["TAG, service and nameplate data (Q, H, kW, rpm). Manufacturer curves (H–Q, η–Q, P–Q, NPSHr) and motor efficiency curve.", "TAG, serviço e dados de placa (Q, H, kW, rpm). Curvas do fabricante (H–Q, η–Q, P–Q, NPSHr) e curva de rendimento do motor."], "2. Seguridad y permisos": ["2. Safety and permits", "2. Segurança e permissões"], "Permiso de trabajo, EPP y riesgo eléctrico. En áreas clasificadas (ATEX/IECEx, Clase I Div. 1/2) use solo instrumentos certificados: un teléfono común no lo está. En media tensión, solo personal cualificado.": ["Work permit, PPE and electrical risk. In classified areas (ATEX/IECEx, Class I Div. 1/2) use only certified instruments: an ordinary phone is not certified. On medium voltage, only qualified personnel.", "Permissão de trabalho, EPI e risco elétrico. Em áreas classificadas (ATEX/IECEx, Classe I Div. 1/2) use apenas instrumentos certificados: um celular comum não é certificado. Em média tensão, apenas pessoal qualificado."], "3. Verificar instrumentos": ["3. Check instruments", "3. Verificar instrumentos"], "Calibración vigente. Manómetros trabajando entre 30 y 70 % del fondo de escala. Caudalímetro y analizador de red trifásico.": ["Valid calibration. Gauges working between 30 and 70 % of full scale. Flow meter and three-phase power analyzer.", "Calibração vigente. Manômetros trabalhando entre 30 e 70 % do fundo de escala. Medidor de vazão e analisador de rede trifásico."], "B. Instalación de instrumentos": ["B. Instrument installation", "B. Instalação dos instrumentos"], "4. Presiones de aspiración e impulsión": ["4. Suction and discharge pressures", "4. Pressões de sucção e recalque"], "Tomas cercanas a las bridas, líneas purgadas. Medir la diferencia de cota Δz entre los ejes de ambos manómetros y los diámetros internos.": ["Taps close to the flanges, lines purged. Measure the elevation difference Δz between both gauge axes and the internal diameters.", "Tomadas próximas aos flanges, linhas purgadas. Medir a diferença de cota Δz entre os eixos dos dois manômetros e os diâmetros internos."], "5. Caudal": ["5. Flow", "5. Vazão"], "Tramo recto (≥ 10 D aguas arriba y ≥ 5 D aguas abajo), tubería llena y sin burbujas. Diámetro interno y material correctos. Con crudo o fluidos viscosos, confirme que el caudalímetro es apto.": ["Straight run (≥ 10 D upstream and ≥ 5 D downstream), full pipe with no bubbles. Correct internal diameter and material. With crude oil or viscous fluids, confirm the flow meter is suitable.", "Trecho reto (≥ 10 D a montante e ≥ 5 D a jusante), tubulação cheia e sem bolhas. Diâmetro interno e material corretos. Com petróleo ou fluidos viscosos, confirme que o medidor de vazão é adequado."], "6. Potencia eléctrica": ["6. Electrical power", "6. Potência elétrica"], "V, I y cos φ en el cuadro o bornes del motor, o kW directos. Con variador de frecuencia, use un instrumento apto para señales no senoidales.": ["V, I and cos φ at the motor panel or terminals, or direct kW. With a variable frequency drive, use an instrument suitable for non-sinusoidal signals.", "V, I e cos φ no quadro ou bornes do motor, ou kW diretos. Com inversor de frequência, use um instrumento adequado para sinais não senoidais."], "7. Temperatura y propiedades del fluido": ["7. Fluid temperature and properties", "7. Temperatura e propriedades do fluido"], "Registrar T y obtener ρ y ν a esa temperatura (análisis de laboratorio u hoja de datos).": ["Record T and get ρ and ν at that temperature (lab analysis or datasheet).", "Registrar T e obter ρ e ν nessa temperatura (análise de laboratório ou folha de dados)."], "C. Medición": ["C. Measurement", "C. Medição"], "8. Estabilizar la operación": ["8. Stabilize operation", "8. Estabilizar a operação"], "10–15 min con el proceso estable (lecturas con variación menor a ~2 %).": ["10–15 min with the process stable (readings varying less than ~2 %).", "10–15 min com o processo estável (leituras com variação menor que ~2 %)."], "9. Definir puntos de operación": ["9. Define operating points", "9. Definir pontos de operação"], "Mínimo 3–5 puntos (60–110 % del caudal nominal) variando la válvula de impulsión. No cerrar del todo ni operar bajo el caudal mínimo del fabricante.": ["At least 3–5 points (60–110 % of rated flow) varying the discharge valve. Do not close it fully or operate below the manufacturer's minimum flow.", "Mínimo de 3–5 pontos (60–110 % da vazão nominal) variando a válvula de recalque. Não feche totalmente nem opere abaixo da vazão mínima do fabricante."], "10. Registrar en cada punto": ["10. Record at each point", "10. Registrar em cada ponto"], "Q, Ps, Pd, V, I, cos φ y T de forma simultánea. Tomar 3 lecturas y promediar.": ["Q, Ps, Pd, V, I, cos φ and T simultaneously. Take 3 readings and average.", "Q, Ps, Pd, V, I, cos φ e T simultaneamente. Tomar 3 leituras e calcular a média."], "11. Medir la vibración (ISO 20816-3)": ["11. Measure vibration (ISO 20816-3)", "11. Medir a vibração (ISO 20816-3)"], "En cada punto de operación, con vibrómetro o acelerómetro (velocidad en mm/s RMS, banda típica 10–1000 Hz), sobre las carcasas de los cojinetes: motor lado libre (horizontal y vertical), motor lado acople (horizontal, vertical y axial), bomba lado acople (horizontal, vertical y axial) y bomba lado libre (horizontal y vertical). Use siempre los mismos puntos de medición.": ["At each operating point, with a vibrometer or accelerometer (velocity in mm/s RMS, typical band 10–1000 Hz), on the bearing housings: motor free end (horizontal and vertical), motor coupling end (horizontal, vertical and axial), pump coupling end (horizontal, vertical and axial) and pump free end (horizontal and vertical). Always use the same measurement points.", "Em cada ponto de operação, com vibrômetro ou acelerômetro (velocidade em mm/s RMS, faixa típica de 10–1000 Hz), sobre as carcaças dos mancais: motor lado livre (horizontal e vertical), motor lado acoplamento (horizontal, vertical e axial), bomba lado acoplamento (horizontal, vertical e axial) e bomba lado livre (horizontal e vertical). Use sempre os mesmos pontos de medição."], "D. Cálculo": ["D. Calculation", "D. Cálculo"], "12. Ingresar los datos en la app": ["12. Enter the data in the app", "12. Inserir os dados no app"], "Pestaña «Puntos». Revise las advertencias de cada punto.": ["«Points» tab. Review the warnings for each point.", "Aba «Pontos». Revise os avisos de cada ponto."], "E. Análisis y cierre": ["E. Analysis and closing", "E. Análise e encerramento"], "13. Comparar con la curva del fabricante": ["13. Compare with the manufacturer's curve", "13. Comparar com a curva do fabricante"], "Más de 5 puntos por debajo de la curva justifica inspección (anillos, rodete, cavitación, recirculación). Criterio orientativo, no normativo.": ["More than 5 points below the curve warrants inspection (rings, impeller, cavitation, recirculation). Indicative criterion, not normative.", "Mais de 5 pontos abaixo da curva justifica inspeção (anéis, rotor, cavitação, recirculação). Critério orientativo, não normativo."], "14. Evaluar incertidumbre": ["14. Assess uncertainty", "14. Avaliar incerteza"], "Las pruebas in situ tienen más incertidumbre que un ensayo de aceptación (ISO 9906, ANSI/HI 40.6). En servicios de petróleo y gas, compare con la curva del ensayo de fábrica exigido por API 610 / ISO 13709.": ["Field tests have more uncertainty than an acceptance test (ISO 9906, ANSI/HI 40.6). In oil and gas services, compare against the factory test curve required by API 610 / ISO 13709.", "Testes em campo têm mais incerteza que um ensaio de aceitação (ISO 9906, ANSI/HI 40.6). Em serviços de petróleo e gás, compare com a curva do ensaio de fábrica exigido pela API 610 / ISO 13709."], "15. Informe y acciones": ["15. Report and actions", "15. Relatório e ações"], "Punto de operación vs BEP, energía específica, estado de vibración (zona A–D) y acciones: mantenimiento, recorte de rodete, variador.": ["Operating point vs BEP, specific energy, vibration status (zone A–D) and actions: maintenance, impeller trimming, variable speed drive.", "Ponto de operação vs BEP, energia específica, estado de vibração (zona A–D) e ações: manutenção, corte do rotor, inversor de frequência."], "16. Restablecer la instalación": ["16. Restore the installation", "16. Restabelecer a instalação"], "Retirar instrumentos, cerrar tomas de presión, restablecer condiciones normales y cerrar permisos.": ["Remove instruments, close pressure taps, restore normal conditions and close permits.", "Retirar instrumentos, fechar tomadas de pressão, restabelecer condições normais e encerrar as permissões."], "Historial de evaluaciones": ["Evaluation history", "Histórico de avaliações"], "Aún no hay evaluaciones guardadas. En «Resultados» use «Guardar en historial».": ["No evaluations saved yet. In «Results» use «Save to history».", "Ainda não há avaliações salvas. Em «Resultados» use «Salvar no histórico»."], "Normas de referencia": ["Reference standards", "Normas de referência"], "Bombas centrífugas para las industrias del petróleo, petroquímica y gas natural. Cubre bombas en voladizo (OH), entre cojinetes (BB) y de suspensión vertical (VS). La 11.ª edición de API 610 es la adopción idéntica de ISO 13709:2009; la 13.ª edición de API 610 se publicó en 2026. Use la edición vigente en su empresa. En esta app: designación de tipos, zona de operación preferida y curvas del ensayo de fábrica como referencia.": ["Centrifugal pumps for the petroleum, petrochemical and natural gas industries. Covers overhung (OH), between-bearings (BB) and vertically suspended (VS) pumps. API 610's 11th edition is the identical adoption of ISO 13709:2009; API 610's 13th edition was published in 2026. Use the edition current at your company. In this app: type designation, preferred operating region and factory test curves as a reference.", "Bombas centrífugas para as indústrias de petróleo, petroquímica e gás natural. Abrange bombas em balanço (OH), entre mancais (BB) e de suspensão vertical (VS). A 11ª edição da API 610 é a adoção idêntica da ISO 13709:2009; a 13ª edição da API 610 foi publicada em 2026. Use a edição vigente na sua empresa. Neste app: designação de tipos, região de operação preferida e curvas do ensaio de fábrica como referência."], "Evaluación de la vibración de máquinas industriales de más de 15 kW (120–30 000 r/min) por mediciones en partes no rotativas. Clasifica en zonas A, B, C y D según el grupo (Grupo 1: > 300 kW; Grupo 2: 15–300 kW) y la rigidez de la cimentación. Base del criterio apto / no apto de esta app.": ["Evaluation of vibration on industrial machines above 15 kW (120–30,000 r/min) through measurements on non-rotating parts. Classifies zones A, B, C and D according to the group (Group 1: > 300 kW; Group 2: 15–300 kW) and foundation stiffness. Basis for this app's fit / not fit criterion.", "Avaliação da vibração de máquinas industriais acima de 15 kW (120–30.000 r/min) por medições em partes não rotativas. Classifica em zonas A, B, C e D conforme o grupo (Grupo 1: > 300 kW; Grupo 2: 15–300 kW) e a rigidez da fundação. Base do critério apto / não apto deste app."], "Vibración en bombas rotodinámicas industriales. Junto con API 610 puede fijar criterios propios y más estrictos para bombas: consúltelos si el contrato los exige.": ["Vibration in industrial rotodynamic pumps. Together with API 610 it may set its own, stricter criteria for pumps: consult them if the contract requires it.", "Vibração em bombas rotodinâmicas industriais. Junto com a API 610 pode definir critérios próprios e mais rígidos para bombas: consulte-os se o contrato exigir."], "Ensayos de rendimiento hidráulico de bombas rotodinámicas, con grados de aceptación 1, 2 y 3. Base de los ensayos de aceptación con los que se compara la incertidumbre de una medición in situ.": ["Hydraulic performance tests for rotodynamic pumps, with acceptance grades 1, 2 and 3. Basis for the acceptance tests against which a field measurement's uncertainty is compared.", "Ensaios de desempenho hidráulico de bombas rotodinâmicas, com graus de aceitação 1, 2 e 3. Base dos ensaios de aceitação com os quais se compara a incerteza de uma medição em campo."], "Métodos de ensayo de eficiencia de bombas rotodinámicas, incluidas las pruebas en sitio.": ["Efficiency test methods for rotodynamic pumps, including field tests.", "Métodos de ensaio de eficiência de bombas rotodinâmicas, incluindo testes em campo."], "Efecto de la viscosidad del líquido en el rendimiento: base de la corrección de eficiencia de esta app.": ["Effect of liquid viscosity on performance: basis for this app's efficiency correction.", "Efeito da viscosidade do líquido no desempenho: base da correção de eficiência deste app."], "Región de operación admisible y preferida de bombas rotodinámicas.": ["Allowable and preferred operating region of rotodynamic pumps.", "Região de operação admissível e preferida de bombas rotodinâmicas."], "Margen de NPSH.": ["NPSH margin.", "Margem de NPSH."], "Determinación de pérdidas y rendimiento de motores eléctricos, útil para justificar el η del motor.": ["Determination of losses and efficiency of electric motors, useful to justify the motor η.", "Determinação de perdas e rendimento de motores elétricos, útil para justificar o η do motor."], "La app no reproduce el texto de las normas: consulte la edición vigente y los requisitos de su empresa.": ["The app does not reproduce the text of the standards: consult the current edition and your company's requirements.", "O app não reproduz o texto das normas: consulte a edição vigente e os requisitos da sua empresa."], "Fórmulas y método": ["Formulas and method", "Fórmulas e método"], "Altura total": ["Total head", "Altura total"], "Potencia hidráulica": ["Hydraulic power", "Potência hidráulica"], "Potencia eléctrica (trifásica)": ["Electrical power (three-phase)", "Potência elétrica (trifásica)"], "Potencia en el eje": ["Shaft power", "Potência no eixo"], "Eficiencia": ["Efficiency", "Eficiência"], "Energía específica": ["Specific energy", "Energia específica"], "NPSH disponible": ["NPSH available", "NPSH disponível"], "Viscosidad (estimación tipo ANSI/HI 9.6.7)": ["Viscosity (ANSI/HI 9.6.7-type estimate)", "Viscosidade (estimativa tipo ANSI/HI 9.6.7)"], "válido con B entre 1 y 40 y hasta 4000 cSt, bombas radiales": ["valid with B between 1 and 40 and up to 4000 cSt, radial pumps", "válido com B entre 1 e 40 e até 4000 cSt, bombas radiais"], "Seguridad y límites de uso": ["Safety and limits of use", "Segurança e limites de uso"], "No use este teléfono en áreas clasificadas (atmósferas explosivas) salvo que el equipo esté certificado para ello. Tome las lecturas con instrumentos apropiados y anótelas después.": ["Do not use this phone in classified areas (explosive atmospheres) unless the device is certified for it. Take readings with appropriate instruments and record them afterward.", "Não use este celular em áreas classificadas (atmosferas explosivas), a menos que o aparelho seja certificado para isso. Faça as leituras com instrumentos apropriados e anote-as depois."], "Los resultados son orientativos. Una medición in situ tiene más incertidumbre que un ensayo de aceptación (ISO 9906, ANSI/HI 40.6) y no sustituye a las pruebas de garantía del fabricante ni a los ensayos exigidos por API 610 / ISO 13709.": ["The results are indicative. A field measurement has more uncertainty than an acceptance test (ISO 9906, ANSI/HI 40.6) and does not replace the manufacturer's warranty tests or the tests required by API 610 / ISO 13709.", "Os resultados são orientativos. Uma medição em campo tem mais incerteza que um ensaio de aceitação (ISO 9906, ANSI/HI 40.6) e não substitui os testes de garantia do fabricante nem os ensaios exigidos pela API 610 / ISO 13709."], "La corrección por viscosidad es una estimación para bombas radiales. Para decisiones importantes pida al fabricante la curva con el fluido real.": ["The viscosity correction is an estimate for radial pumps. For important decisions, ask the manufacturer for the curve with the actual fluid.", "A correção por viscosidade é uma estimativa para bombas radiais. Para decisões importantes, peça ao fabricante a curva com o fluido real."], "Los rangos típicos de eficiencia sirven solo como filtro de plausibilidad cuando no se dispone de la curva del fabricante.": ["The typical efficiency ranges serve only as a plausibility check when the manufacturer's curve isn't available.", "As faixas típicas de eficiência servem apenas como um filtro de plausibilidade quando a curva do fabricante não está disponível."], "Privacidad: todo se guarda únicamente en este dispositivo. La app no envía datos a ningún servidor ni requiere cuenta.": ["Privacy: everything is stored only on this device. The app does not send data to any server or require an account.", "Privacidade: tudo é salvo apenas neste dispositivo. O app não envia dados a nenhum servidor nem exige conta."], "Apariencia y datos": ["Appearance and data", "Aparência e dados"], "Automático": ["Automatic", "Automático"], "Claro": ["Light", "Claro"], "Oscuro": ["Dark", "Escuro"], "Instalar en el teléfono": ["Install on phone", "Instalar no celular"], "Nueva evaluación": ["New evaluation", "Nova avaliação"], "Borrar todo": ["Delete all", "Apagar tudo"], "EVALUACIÓN DE EFICIENCIA DE BOMBA": ["PUMP EFFICIENCY EVALUATION", "AVALIAÇÃO DE EFICIÊNCIA DE BOMBA"], "Empresa:": ["Company:", "Empresa:"], "Equipo/TAG:": ["Equipment/TAG:", "Equipamento/TAG:"], "Servicio:": ["Service:", "Serviço:"], "Tipo:": ["Type:", "Tipo:"], "Fluido:": ["Fluid:", "Fluido:"], "etapas": ["stages", "estágios"], "Pto": ["Pt", "Pt"], "η bomba": ["η pump", "η bomba"], "η global": ["η overall", "η global"], "Horiz.": ["Horiz.", "Horiz."], "Vert.": ["Vert.", "Vert."], "η bomba %": ["η pump %", "η bomba %"], "η global %": ["η overall %", "η global %"], "Desv pts": ["Dev pts", "Desv pts"], "incompleto": ["incomplete", "incompleto"], "Método: hidráulico–eléctrico in situ. Resultado orientativo (no es ensayo de aceptación ISO 9906).": ["Method: field hydraulic–electrical. Indicative result (not an ISO 9906 acceptance test).", "Método: hidráulico–elétrico em campo. Resultado orientativo (não é um ensaio de aceitação ISO 9906)."], "Resultado de vibración": ["Vibration result", "Resultado de vibração"], "Guardar y compartir": ["Save and share", "Salvar e compartilhar"], "Guardar en historial": ["Save to history", "Salvar no histórico"], "Copiar resumen": ["Copy summary", "Copiar resumo"], "Compartir (WhatsApp, correo…)": ["Share (WhatsApp, email…)", "Compartilhar (WhatsApp, e-mail…)"], "Descargar CSV": ["Download CSV", "Baixar CSV"], "Descargar informe": ["Download report", "Baixar relatório"], "Mantener la pantalla encendida": ["Keep the screen on", "Manter a tela ligada"], "Útil mientras toma lecturas en el campo.": ["Useful while taking readings in the field.", "Útil enquanto faz leituras em campo."], "Aceptar": ["Accept", "Aceitar"], "Cancelar": ["Cancel", "Cancelar"], "Confirmar": ["Confirm", "Confirmar"], "La descarga no está disponible aquí: use «Copiar resumen»": ["Download isn't available here: use «Copy summary»", "O download não está disponível aqui: use «Copiar resumo»"], "¿Eliminar el punto ": ["Delete point ", "Excluir o ponto "], "¿Eliminar esta evaluación del historial?": ["Delete this evaluation from history?", "Excluir esta avaliação do histórico?"], "Eliminar punto ": ["Delete point ", "Excluir ponto "], "Eliminar": ["Delete", "Excluir"], "Abrir": ["Open", "Abrir"], "¿Empezar una evaluación nueva? Se conservan unidades, incertidumbres y el historial.": ["Start a new evaluation? Units, uncertainties and history are kept.", "Começar uma nova avaliação? Unidades, incertezas e o histórico são mantidos."], "¿Borrar todos los datos de este dispositivo, incluido el historial?": ["Delete all data on this device, including history?", "Apagar todos os dados deste aparelho, incluindo o histórico?" var PHRASE_KEYS = Object.keys(PHRASES).sort(function(a,b){ return b.length-a.length; });
function rxEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
// Una sola pasada con alternancia (más larga primero): evita que una frase ya
// traducida vuelva a coincidir con una clave más corta (p. ej. "Velocidade"
// contiene "Velocidad" y terminaba dando "Velocidadee").
var PHRASE_RE = new RegExp(PHRASE_KEYS.map(rxEsc).join('|'), 'g');
var LANG = 'es';
try{ LANG = localStorage.getItem('ebp:lang') || 'es'; }catch(e){}
if(['es','en','pt'].indexOf(LANG)<0) LANG='es';
function trHTML(str){
  if(LANG==='es' || !str) return str;
  var idx = LANG==='en' ? 0 : 1;
  return str.replace(PHRASE_RE, function(m){ var tr=PHRASES[m][idx]; return tr!==undefined?tr:m; });
}

// Límites de zona [A/B, B/C, C/D]. Grupo 1: > 300 kW; Grupo 2: 15–300 kW.
var VIB_LIMITS = { g1:{ rigid:[2.3,4.5,7.1], flex:[3.5,7.1,11.0] }, g2:{ rigid:[1.4,2.8,4.5], flex:[2.3,4.5,7.1] } };
var VIB_LOCS = [
  ['ml','Motor · lado libre',['h','v'],'Motor libre'],
  ['ma','Motor · lado acople',['h','v','a'],'Motor acople'],
  ['ba','Bomba · lado acople',['h','v','a'],'Bomba acople'],
  ['bl','Bomba · lado libre',['h','v'],'Bomba libre']
];
var VIB_DIR = { h:'Horizontal', v:'Vertical', a:'Axial' };
var ZONE_TXT = { A:'Zona A: máquina nueva o recién intervenida', B:'Zona B: aceptable para operación continua', C:'Zona C: no apta para operación continua prolongada', D:'Zona D: la vibración puede causar daño' };
function vibGroup(S){ return S.pump.clase==='gt300' ? 'g1' : 'g2'; }
function vibLimits(S){ return VIB_LIMITS[vibGroup(S)][S.pump.fund==='flex' ? 'flex' : 'rigid']; }
function vibZone(v, lim){ if(v===null||v===undefined||!(v>=0)) return null; return v<=lim[0]?'A':v<=lim[1]?'B':v<=lim[2]?'C':'D'; }
function vibVerdict(z){
  if(z==='A'||z==='B') return { k:'ok', t:'Apto · Zona '+z };
  if(z==='C') return { k:'warn', t:'No apto · Zona C' };
  if(z==='D') return { k:'bad', t:'No apto · Zona D' };
  return { k:'info', t:'Sin lecturas' };
}
function vibEval(S, p){
  var lim = vibLimits(S), items=[], worst=null;
  VIB_LOCS.forEach(function(L){ L[2].forEach(function(d){
    var v = p.vib ? p.vib[L[0]+'_'+d] : null;
    if(v===null||v===undefined||!(v>=0)) return;
    var it = { loc:L[0], locName:L[1], dir:d, v:v, z:vibZone(v,lim) };
    items.push(it);
    if(!worst || it.z>worst.z || (it.z===worst.z && it.v>worst.v)) worst=it;
  }); });
  return { lim:lim, items:items, worst:worst, n:items.length };
}

function num(x){
  if(x===null||x===undefined||x==='') return NaN;
  if(typeof x==='number') return x;
  var n = parseFloat(String(x).trim().replace(/\s/g,'').replace(',', '.'));
  return isFinite(n) ? n : NaN;
}
function etaMotorDefault(S){
  return (S.pump.etaMdef>0) ? S.pump.etaMdef : (S.pump.clase==='gt300' ? 95.5 : 93);

// Corrección por viscosidad (estimación tipo ANSI/HI 9.6.7 para bombas radiales; B entre 1 y 40, 1–4000 cSt)
// B = 16.5·ν^0.5·H^0.0625 / (Q^0.375·N^0.25)   [ν cSt, H m por etapa en el BEP, Q m³/h en el BEP, N rpm]
function viscCorr(nu, Qbep, Hbep, stages, rpm){
  var r = { applies:false, B:0, CQ:1, Ceta:1, inRange:true };
  if(!(nu>1)) return r;
  if(!(Qbep>0 && Hbep>0 && rpm>0)){ r.missing = true; return r; }
  var Hs = Hbep/Math.max(1, stages||1);
  var B = 16.5*Math.sqrt(nu)*Math.pow(Hs,0.0625)/(Math.pow(Qbep,0.375)*Math.pow(rpm,0.25));
  r.B = B;
  if(B<=1) return r;
  r.applies = true;
  r.inRange = (B<=40 && nu<=4000);
  r.CQ = Math.pow(2.71, -0.165*Math.pow(Math.log(B)/Math.LN10, 3.15));
  r.Ceta = Math.pow(B, -0.0547*Math.pow(B, 0.69));
  return r;
}

function calcPoint(S, p){
  var R = { ok:false, missing:[], warns:[] };
  var rho=S.fluid.rho, Ds=S.inst.Ds, Dd=S.inst.Dd, Q=p.Q;
  if(!(Q>0)) R.missing.push('Q');
  if(p.Ps===null||p.Ps===undefined) R.missing.push('Ps');
  if(p.Pd===null||p.Pd===undefined) R.missing.push('Pd');
  if(S.mode==='vi'){
    if(!(p.V>0)) R.missing.push('V');
    if(!(p.I>0)) R.missing.push('I');
    if(!(p.cos>0 && p.cos<=1)) R.missing.push('cos φ');
  } else if(!(p.kW>0)) R.missing.push('kW');
  if(!(rho>0)) R.missing.push('ρ (Fluido)');
  if(!(Ds>0)) R.missing.push('Ds (Equipo)');
  if(!(Dd>0)) R.missing.push('Dd (Equipo)');
  if(R.missing.length) return R;

  var Qs=Q/3600, As=Math.PI*Math.pow(Ds/1000,2)/4, Ad=Math.PI*Math.pow(Dd/1000,2)/4;
  var vs=Qs/As, vd=Qs/Ad;
  var H = (p.Pd-p.Ps)*1e5/(rho*G) + (S.inst.dz||0) + (vd*vd-vs*vs)/(2*G);
  if(!(H>0)){ R.error='H ≤ 0: la bomba no genera altura. Revise Ps y Pd (¿invertidas?) y Δz.'; return R; }
  var Ph = rho*G*Qs*H/1000;
  var Pe = S.mode==='vi' ? Math.sqrt(3)*p.V*p.I*p.cos/1000 : p.kW;
  var etaMp = (p.etaM>0) ? p.etaM : etaMotorDefault(S);
  var etaM = etaMp/100, etaT = (S.pump.etaT>0 ? S.pump.etaT : 100)/100;
  var Peje = Pe*etaM*etaT;
  var eta = Ph/Peje*100, etaG = Ph/Pe*100, Eesp = Pe/Q;
  R.ok=true; R.Q=Q; R.vs=vs; R.vd=vd; R.H=H; R.Ph=Ph; R.Pe=Pe; R.Peje=Peje;
  R.eta=eta; R.etaG=etaG; R.Eesp=Eesp; R.EespBbl=Eesp*BBL; R.etaM=etaM; R.etaT=etaT; R.etaMp=etaMp;

  // --- Viscosidad
  var vc = { applies:false, B:0, CQ:1, Ceta:1, inRange:true, approx:false };
  if(S.fluid.applyVisc!==false && S.fluid.visc>1){
    var haveBEP = S.pump.Qbep>0 && S.pump.Hbep>0;
    var st = S.pump.tipo==='multi' ? Math.max(2, S.pump.etapas||2) : 1;
    vc = viscCorr(S.fluid.visc, haveBEP?S.pump.Qbep:Q, haveBEP?S.pump.Hbep:H, st, S.pump.rpm>0?S.pump.rpm:2950);
    vc.approx = !haveBEP;
  }
  R.visc = vc;
  var Ceta = vc.applies ? vc.Ceta : 1;

  // --- Referencia de eficiencia
  var band = BANDS[S.pump.tipo][S.pump.clase];
  R.band = band;
  if(p.etaRef>0){ R.ref=p.etaRef*Ceta; R.src='curve'; }
  else if(S.pump.etaBep>0 && S.pump.Qbep>0 && Math.abs(Q/S.pump.Qbep-1)<=0.10){ R.ref=S.pump.etaBep*Ceta; R.src='bep'; }
  else { R.src='band'; R.low=band[0]*Ceta; R.mid=(band[0]+band[1])/2*Ceta; R.ref=null; }

  // --- Incertidumbre (raíz de suma de cuadrados de errores relativos)
  var u=S.unc||{}, uQ=(u.Q||0)/100, uW=(u.W||0)/100, uR=(u.rho||0)/100;
  var absP=(u.P||0)/100*(u.FS||0);
  var uH=(Math.SQRT2*absP*1e5/(rho*G))/H;
  var uM=(u.etaM||0)/etaMp;
  R.U = eta*Math.sqrt(uQ*uQ+uW*uW+uR*uR+uH*uH+uM*uM);

  // --- Estado
  var dev=null, stt;
  if(eta>100){ R.invalid=true; stt={k:'bad', t:'Resultado no válido (η > 100 %)'}; }
  else if(R.src!=='band'){
    dev=eta-R.ref; R.dev=dev;
    if(dev>=-2){ stt = dev>6 ? {k:'warn', t:'Sobre la curva: verificar mediciones'} : {k:'ok', t:'Normal'}; }
    else if(dev>-5) stt={k:'warn', t:'Vigilar'};
    else stt={k:'bad', t:'Inspección recomendada'};
    if(stt.k!=='ok' && dev<0 && dev+R.U>=-2) R.inUnc=true;
  } else {
    dev=eta-R.low; R.devBand=dev;
    if(eta>=R.low) stt={k:'ok', t:'Dentro del rango típico'};
    else if(eta>=R.low-5) stt={k:'warn', t:'Algo bajo el rango típico'};
    else stt={k:'bad', t:'Bajo el rango típico'};
  }
  R.status=stt;

  // --- Altura vs curva del fabricante
  if(p.Href>0){
    var Qb = S.pump.Qbep>0 ? S.pump.Qbep : Q;
    var CH = vc.applies ? 1-(1-vc.CQ)*Math.pow(Q/Qb,0.75) : 1;
    R.Href=p.Href*CH; R.hdev=(H-R.Href)/R.Href*100;
    if(R.hdev<-5) R.warns.push({k:'warn', t:'Altura '+Math.abs(R.hdev).toFixed(1)+' % por debajo de la curva: posible desgaste de rodete/anillos o recirculación.'});
  }

  // --- Avisos de plausibilidad
  if(eta>95 && eta<=100) R.warns.push({k:'warn', t:'η > 95 % es poco probable en bombas industriales: revise caudal, presiones y potencia.'});
  if(S.pump.Qbep>0){
    var ratio=Q/S.pump.Qbep; R.qr=ratio;
    if(ratio<0.5) R.warns.push({k:'bad', t:'Caudal por debajo del 50 % del BEP: riesgo de recirculación, vibración y desgaste.'});
    else if(ratio<0.7 || ratio>1.2) R.warns.push({k:'warn', t:'Fuera de la zona de operación preferida (≈70–120 % del BEP; concepto de API 610 / ISO 13709 y HI 9.6.3): la eficiencia y la vida útil se reducen.'});
  }
  if(S.pump.motorKW>0){
    var load=Pe*etaM/S.pump.motorKW*100; R.load=load;
    if(load<40) R.warns.push({k:'warn', t:'Motor con carga baja ('+load.toFixed(0)+' %): su rendimiento real puede ser menor que el usado.'});
    else if(load>100) R.warns.push({k:'bad', t:'Motor por encima de su potencia nominal ('+load.toFixed(0)+' %): revise datos o condiciones.'});
  }
  if(p.Ps<0) R.warns.push({k:'info', t:'Aspiración en vacío: verifique el NPSH disponible.'});
  if(vs>3.5) R.warns.push({k:'warn', t:'Velocidad de aspiración alta ('+vs.toFixed(1)+' m/s): revise diámetro medido y riesgo de cavitación.'});
  if(vc.applies && !vc.inRange) R.warns.push({k:'bad', t:'Viscosidad fuera del rango del método de corrección (B > 40 o > 4000 cSt): use la curva del fabricante para este fluido.'});
  if(vc.applies && vc.approx) R.warns.push({k:'info', t:'Corrección por viscosidad aproximada: falta Q y H del BEP en «Equipo».'});
  if(S.fluid.Pv>=0 && S.fluid.Pv!==null){
    var patm=S.fluid.Patm>0?S.fluid.Patm:1.013;
    R.NPSHa=((p.Ps+patm-S.fluid.Pv)*1e5)/(rho*G)+vs*vs/(2*G);
    if(p.NPSHr>0){
      if(R.NPSHa<p.NPSHr) R.warns.push({k:'bad', t:'NPSH disponible ('+R.NPSHa.toFixed(1)+' m) menor que el requerido ('+p.NPSHr+' m): cavitación probable.'});
      else if(R.NPSHa<1.3*p.NPSHr) R.warns.push({k:'warn', t:'Margen de NPSH reducido: disponible '+R.NPSHa.toFixed(1)+' m vs requerido '+p.NPSHr+' m (< 1.3×).'});
    }
  }
  return R;
}

function calcAll(S){
  var pts = S.points.map(function(p){ return calcPoint(S,p); });
  var good = pts.filter(function(r){ return r.ok && !r.invalid; });
  function avg(k){ return good.length ? good.reduce(function(a,r){ return a+r[k]; },0)/good.length : null; }
  var vib = S.points.map(function(p){ return vibEval(S,p); }), vibAll=null;
  vib.forEach(function(e,i){ var w=e.worst; if(w && (!vibAll || w.z>vibAll.z || (w.z===vibAll.z && w.v>vibAll.v))) vibAll={ pt:i, loc:w.loc, locName:w.locName, dir:w.dir, v:w.v, z:w.z }; });
  return { pts:pts, good:good, vib:vib, vibAll:vibAll, etaAvg:avg('eta'), etaGAvg:avg('etaG'), eespAvg:avg('Eesp') };
}

// Ahorro potencial si la bomba operara en su eficiencia de referencia
function savings(S, r, hours, price){
  var target = r.src==='band' ? r.mid : r.ref;
  if(!(target>0) || !(r.eta<target)) return null;
  var PeT = r.Ph/((target/100)*r.etaM*r.etaT);
  var dkW = r.Pe-PeT;
  if(!(dkW>0)) return null;
  var kwh = hours>0 ? dkW*hours : null;
  return { target:target, dkW:dkW, kwh:kwh, cost:(kwh!==null && price>0) ? kwh*price : null, pct:dkW/r.Pe*100 };
}

// Propiedades del agua a temperatura T (°C), 0–100 °C
function waterProps(T){
  var rho = 1000*(1-(T+288.9414)/(508929.2*(T+68.12963))*Math.pow(T-3.9863,2));
  var mu = 2.414e-5*Math.pow(10,247.8/(T+133.15));
  var Pv = Math.pow(10,8.07131-1730.63/(233.426+T))*0.00133322;
  return { rho:rho, visc:mu/rho*1e6, Pv:Pv };
}

function viscInfo(){
  var f0=S.fluid, P=S.pump, nu=f0.visc;
  if(!(nu>0)) return {k:'info', h:'Ingrese la viscosidad cinemática del fluido a la temperatura de bombeo.'};
  if(!(nu>1)) return {k:'ok', h:'Viscosidad similar a la del agua: <b>sin corrección</b> de eficiencia.'};
  var have=P.Qbep>0&&P.Hbep>0;
  if(!have) return {k:'warn', h:'Este fluido es más viscoso que el agua. Ingrese <b>caudal y altura en el BEP</b> (pestaña Equipo) para estimar cuánto baja la eficiencia esperada.'};
  var vc=viscCorr(nu,P.Qbep,P.Hbep,P.tipo==='multi'?Math.max(2,P.etapas||2):1,P.rpm>0?P.rpm:2950);
  if(!vc.applies) return {k:'ok', h:'Parámetro B = <b>'+f(vc.B,2)+'</b> (≤ 1): la viscosidad casi no afecta a la eficiencia.'};
  var txt='Parámetro B = <b>'+f(vc.B,1)+'</b>. La eficiencia esperada baja a <b>'+f(vc.Ceta*100,0)+' %</b> de su valor con agua (Cη = '+f(vc.Ceta,2)+'; factor de caudal CQ = '+f(vc.CQ,2)+').';
  if(!vc.inRange) return {k:'bad', h:txt+' Está <b>fuera del rango del método</b> (B ≤ 40, ≤ 4000 cSt): pida al fabricante la curva para este fluido.'};
  return {k:vc.Ceta<0.85?'warn':'info', h:txt+' Estimación orientativa; la curva del fabricante para este fluido prevalece.'};
}

/* ---- Dial de eficiencia ---- */
function dialSVG(R){
  var lo=30, hi=100, cx=110, cy=106, RR=84;
  function ang(v){ var t=(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo); return Math.PI*(1-t); }
  function pt(v,rad){ var a=ang(v); return [cx+rad*Math.cos(a), cy-rad*Math.sin(a)]; }
  function arc(a,b,cls){ if(b-a<=0.05) return ''; var p1=pt(a,RR), p2=pt(b,RR); return '<path class="dz '+cls+'" d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+RR+' '+RR+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+'"/>'; }
  var z2 = R.src==='band' ? R.low : R.ref-2, z1 = R.src==='band' ? R.low-5 : R.ref-5;
  z1=Math.min(hi,Math.max(lo,z1)); z2=Math.min(hi,Math.max(lo,z2));
  var s='<svg class="dial" viewBox="0 0 220 150" role="img" aria-label="Eficiencia de la bomba '+f(R.eta,1)+' por ciento">';
  s+=arc(lo,z1,'dz-bad')+arc(z1,z2,'dz-warn')+arc(z2,hi,'dz-ok');
  for(var v=lo; v<=hi; v+=10){ var q=pt(v,RR+15); s+='<text class="tk" x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" text-anchor="middle">'+v+'</text>'; }
  if(R.src!=='band'){ var a1=pt(R.ref,RR-11), a2=pt(R.ref,RR+11); s+='<line class="refm" x1="'+a1[0].toFixed(1)+'" y1="'+a1[1].toFixed(1)+'" x2="'+a2[0].toFixed(1)+'" y2="'+a2[1].toFixed(1)+'"/>'; }
  var n=pt(R.eta,RR-20);
  s+='<line class="needle" x1="'+cx+'" y1="'+cy+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'"/><circle class="hub" cx="'+cx+'" cy="'+cy+'" r="6"/>';
  s+='<text class="dv" x="'+cx+'" y="142" text-anchor="middle">'+f(R.eta,1)+' %</text></svg>';
  return s;
}

function niceStep(raw){ var e=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), m=raw/e; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*e; }

function chartSVG(good){
  var W=340,Hh=214,ml=40,mr=14,mt=12,mb=36;
  var pts=good.slice().sort(function(a,b){ return a.Q-b.Q; });
  var xs=pts.map(function(r){ return fromSI('Q',r.Q,S); });
  var qb = S.pump.Qbep>0 ? fromSI('Q',S.pump.Qbep,S) : null;
  var xa=xs.concat(qb?[qb]:[]);
  var x0=Math.min.apply(null,xa), x1=Math.max.apply(null,xa);
  var padX=(x1-x0)*0.12||x1*0.1||1; x0=Math.max(0,x0-padX); x1=x1+padX;
  var ya=[]; pts.forEach(function(r){ ya.push(r.eta,r.etaG); if(r.ref) ya.push(r.ref); });
  var y0=Math.max(0,Math.floor((Math.min.apply(null,ya)-8)/10)*10), y1=Math.min(100,Math.ceil((Math.max.apply(null,ya)+4)/10)*10);
  if(y1<=y0+10) y1=Math.min(100,y0+20);
  function X(v){ return ml+(v-x0)/(x1-x0)*(W-ml-mr); }
  function Y(v){ return mt+(1-(v-y0)/(y1-y0))*(Hh-mt-mb); }
  var s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Eficiencia frente a caudal">';
  ticks(y0,y1,4).forEach(function(t){ s+='<line class="gl" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text class="tk" x="'+(ml-6)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end">'+t+'</text>'; });
  ticks(x0,x1,4).forEach(function(t){ s+='<text class="tk" x="'+X(t).toFixed(1)+'" y="'+(Hh-mb+16)+'" text-anchor="middle">'+t+'</text>'; });
  s+='<line class="ax" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+(Hh-mb)+'" y2="'+(Hh-mb)+'"/><line class="ax" x1="'+ml+'" x2="'+ml+'" y1="'+mt+'" y2="'+(Hh-mb)+'"/>';
  s+='<text class="tk" x="'+((ml+W-mr)/2)+'" y="'+(Hh-6)+'" text-anchor="middle">Caudal ('+esc(unitLabel('Q'))+')</text>';
  s+='<text class="tk" x="12" y="'+((mt+Hh-mb)/2)+'" text-anchor="middle" transform="rotate(-90 12 '+((mt+Hh-mb)/2)+')">η (%)</text>';
  if(qb && qb>=x0 && qb<=x1) s+='<line class="bep" x1="'+X(qb).toFixed(1)+'" x2="'+X(qb).toFixed(1)+'" y1="'+mt+'" y2="'+(Hh-mb)+'"/>';
  function line(key,cls){ var d=pts.map(function(r,i){ return (i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(r[key]).toFixed(1); }).join(' '); return '<path class="'+cls+'" d="'+d+'" fill="none" stroke-width="2"/>'+pts.map(function(r,i){ return '<circle class="'+cls+'" cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(r[key]).toFixed(1)+'" r="4.2"/>'; }).join(''); }
  s+=line('etaG','l2')+line('eta','l1');
  pts.forEach(function(r,i){ if(r.ref){ var cx=X(xs[i]),cy=Y(r.ref); s+='<path class="rf" d="M'+cx.toFixed(1)+' '+(cy-6).toFixed(1)+' L'+(cx+6).toFixed(1)+' '+cy.toFixed(1)+' L'+cx.toFixed(1)+' '+(cy+6).toFixed(1)+' L'+(cx-6).toFixed(1)+' '+cy.toFixed(1)+' Z"/>'; } });
  s+='</svg><div class="leg"><span><i style="background:var(--brand-text)"></i>η bomba</span><span><i style="background:var(--muted)"></i>η global</span><span><i style="background:var(--amber)"></i>Referencia</span>'+(qb?'<span><i style="background:var(--ok)"></i>BEP</span>':'')+'</div>';
  return s;
}

function refText(R){

}

function histHTML(){
  var hist=histLoad();
  if(!hist.length) return '<p class="mut">Aún no hay evaluaciones guardadas. En «Resultados» use «Guardar en historial».</p>';
  var asc=hist.slice().sort(function(a,b){ return a.ts-b.ts; }), prev={}, delta={};
  asc.forEach(function(e){ if(e.tag){ if(prev[e.tag]!==undefined && e.eta!==null && prev[e.tag]!==null) delta[e.id]=e.eta-prev[e.tag]; prev[e.tag]=e.eta; } });
  return hist.map(function(e){
    var d=delta[e.id]; var dtxt=(d!==undefined)?' · <b style="color:var(--'+(d<-2?'bad':d<0?'warn':'ok')+')">'+fsg(d,1)+' pts</b> vs. anterior':'';
    return '<div class="hi"><div class="t"><b>'+esc(e.tag||'Sin TAG')+' · η '+f(e.eta,1)+' %</b><small>'+esc(e.fecha||'')+' · '+esc(TIPOS[e.tipo]||'')+' '+esc(CLASES[e.clase]||'')+' · '+e.n+' pt.'+dtxt+'</small></div><div class="b"><button class="btn ghost sm" data-act="hopen" data-id="'+e.id+'">Abrir</button><button class="btn danger sm" data-act="hdel" data-id="'+e.id+'" aria-label="Eliminar">✕</button></div></div>';
  }).join('');
}

  document.querySelectorAll('#langSel button').forEach(function(b){ b.setAttribute('aria-current', String(b.dataset.lang===LANG)); });
}
function setLang(l){
  if(['es','en','pt'].indexOf(l)<0) return;
  LANG=l; try{ localStorage.setItem('ebp:lang', l); }catch(e){}
  applyLangStatic(); render(); refreshClassUI(); updateViscPanel(); updateEco();
  if(tab==='puntos') for(var i=0;i<S.points.length;i++) updatePointPreview(i);
}
document.getElementById('langSel').addEventListener('click', function(e){ var b=e.target.closest('button[data-lang]'); if(b) setLang(b.dataset.lang); });
function updateChip(){
  document.getElementById('tagChip').textContent = S.meta.tag || trHTML('Sin TAG');
  var d = fmtDate(S.meta.fecha);
  document.getElementById('hdrSub').innerHTML = trHTML('<span class="co">'+esc(S.meta.empresa||'Empresa sin definir')+'</span><span class="dt">'+(d?'Ensayo '+d:'Sin fecha de ensayo')+'</span>');
}
function applyDL(){ document.querySelectorAll('[data-dl]').forEach(function(b){ b.hidden=!DL; }); }
function render(top){
  $main.innerHTML=trHTML(VIEWS[tab]());
  document.querySelectorAll('#nav button').forEach(function(b){ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  updateChip(); applyDL();
  var bi=document.getElementById('btnInstall'); if(bi && window.deferredInstall) bi.hidden=false;

function go(t){ tab=t; render(true); }
function refreshClassUI(){
  ['le300','gt300'].forEach(function(c){ var b=document.getElementById('cls-'+c); if(b) b.setAttribute('aria-checked', String(S.pump.clase===c)); });
  var hn=document.getElementById('clsHint'); if(hn) hn.innerHTML=trHTML(CLS_HINT[S.pump.clase]);
  var vb=document.getElementById('vibBox'); if(vb) vb.innerHTML=trHTML(vibBoxHTML());
  var e=document.getElementById('etaMdef'); if(e) e.placeholder=String(etaMotorDefault(S));
}
function updateViscPanel(){ var el=document.getElementById('viscPanel'); if(el) el.innerHTML=trHTML(viscPanelHTML()); }
function afterEdit(path){
  save();
  if(path.indexOf('meta.')===0) updateChip();
  else if(path==='pump.motorKW'){ var kw=S.pump.motorKW; if(kw>0){ var c=kw>300?'gt300':'le300'; if(c!==S.pump.clase){ S.pump.clase=c; refreshClassUI(); toast('Rango de potencia: '+CLASES[c]); } } }
  else if(path.indexOf('points.')===0) updatePointPreview(+path.split('.')[1]);
  else if(path.indexOf('econ.')===0) updateEco();
  else if(path.indexOf('fluid.')===0||path.indexOf('pump.')===0) updateViscPanel();
}

/* ---------- Pantalla encendida (Wake Lock) ---------- */
var wl = null, wakeWanted = false;
function setWake(on){
  if(!on){ if(wl){ try{ wl.release(); }catch(e){} wl=null; } return Promise.resolve(true); }
  if(!('wakeLock' in navigator)) return Promise.resolve(false);
  return navigator.wakeLock.request('screen').then(function(l){ wl=l; l.addEventListener('release', function(){ wl=null; }); return true; }, function(){ return false; });
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && wakeWanted && !wl) setWake(true); });

/* ---------- Eventos ---------- */
$main.addEventListener('input', function(e){
  var el=e.target; if(!el.dataset||!el.dataset.bind) return;
  var k=el.dataset.k, val;
  if(k==='txt') val=el.value;
  else { var n=num(el.value); val=isFinite(n)?n:null; if(val!==null && UNITS[k]){ val=toSI(k,val,S); if(!isFinite(val)) val=null; } }
  setPath(S, el.dataset.bind, val);
  afterEdit(el.dataset.bind);
});
$main.addEventListener('change', function(e){
  var el=e.target;
  if(el.dataset.unit){ S.units[el.dataset.unit]=el.value; save(); render(); }
  else if(el.dataset.preset){
    var id=el.value, p=FLUIDS[id]; S.fluid.preset=id;
    if(id!=='otro'){ S.fluid.rho=p.rho; S.fluid.visc=p.visc; S.fluid.T=p.T; S.fluid.Pv=p.Pv; }
    save(); render();
  }
  else if(el.dataset.tog){ S.fluid[el.dataset.tog]=el.checked; save(); updateViscPanel(); }
  else if(el.dataset.chk){ S.checks[el.dataset.chk]=el.checked; save(); }
  else if(el.dataset.wake){ wakeWanted=el.checked; setWake(el.checked).then(function(okk){ if(!okk){ wakeWanted=false; el.checked=false; toast('No se pudo mantener la pantalla encendida'); } }); }
});
var ACT={
  tipo:function(el){ S.pump.tipo=el.dataset.v; save(); render(); },
  clase:function(el){ S.pump.clase=el.dataset.v; save(); refreshClassUI(); },
  fund:function(el){ S.pump.fund=el.dataset.v; save(); refreshClassUI(); },
  mode:function(el){ S.mode=el.dataset.v; save(); render(); },
  goto:function(el){ go(el.dataset.v); },
  addpt:function(){ if(S.points.length>=8){ toast('Máximo 8 puntos'); return; } S.points.push(newPoint()); save(); render(); var n=document.getElementById('pt-'+(S.points.length-1)); if(n) n.scrollIntoView({block:'start'}); },
  delpt:function(el){ var i=+el.dataset.i; askConfirm('¿Eliminar el punto '+(i+1)+'?', function(){ S.points.splice(i,1); if(!S.points.length) S.points.push(newPoint()); save(); render(); }); },
  sel:function(el){ ui.sel=+el.dataset.i; render(); },
  neg:function(el){ var inp=$main.querySelector('input[data-bind="'+el.dataset['for']+'"]'); if(!inp) return; var v=inp.value.trim(); inp.value = v.charAt(0)==='-' ? v.slice(1) : '-'+v; inp.dispatchEvent(new Event('input',{bubbles:true})); inp.focus(); },
  waterT:function(){ var T=S.fluid.T; if(!(T>=0&&T<=100)){ toast('Indique una temperatura entre 0 y 100 °C'); return; } var w=waterProps(T); S.fluid.rho=w.rho; S.fluid.visc=w.visc; S.fluid.Pv=w.Pv; save(); render(); toast('Propiedades del agua a '+T+' °C'); },
  saveHist:function(){ saveToHistory(); },
  copy:function(){ copyText(reportText()); },
  share:function(){ var t=reportText(); if(navigator.share){ navigator.share({title:'Eficiencia de bomba '+(S.meta.tag||''), text:t}).catch(function(e){ if(!e||e.name!=='AbortError') copyText(t); }); } else copyText(t); },
  install:function(){ var e=window.deferredInstall; if(!e){ toast('Use el menú ⋮ del navegador › Instalar aplicación'); return; } e.prompt(); },
  csv:function(){ saveFile(fname('csv'), buildCSV()); },
  htmlrep:function(){ saveFile(fname('html'), buildHTMLReport()); },
  theme:function(el){ store.set('ebp:theme', el.dataset.v); applyTheme(); render(); },
  newEval:function(){ askConfirm('¿Empezar una evaluación nueva? Se conservan unidades, incertidumbres y el historial.', function(){ var keep={units:S.units,unc:S.unc,econ:S.econ,mode:S.mode}; S=normalize(merge(defaultState(),keep)); ui.sel=0; save(); go('equipo'); toast('Evaluación nueva'); }); },
  wipe:function(){ askConfirm('¿Borrar todos los datos de este dispositivo, incluido el historial?', function(){ store.set('ebp:hist',[]); S=normalize(defaultState()); ui.sel=0; save(); go('equipo'); toast('Datos borrados'); }); },
  hopen:function(el){ var e=histLoad().filter(function(x){ return x.id===el.dataset.id; })[0]; if(!e) return; S=normalize(merge(defaultState(),e.snap)); ui.sel=0; save(); go('resultados'); },
  hdel:function(el){ askConfirm('¿Eliminar esta evaluación del historial?', function(){ store.set('ebp:hist', histLoad().filter(function(x){ return x.id!==el.dataset.id; })); var b=document.getElementById('histBox'); if(b) b.innerHTML=histHTML(); }); }
};
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var fn=ACT[el.dataset.act]; if(fn) fn(el);
});
document.getElementById('nav').addEventListener('click', function(e){ var b=e.target.closest('button[data-tab]'); if(b) go(b.dataset.tab); });

/* ---------- Diálogo ---------- */
var modal=document.getElementById('modal');
function openModal(title, bodyHTML, buttons){
  document.getElementById('mTitle').textContent=trHTML(title);
  document.getElementById('mBody').innerHTML=trHTML(bodyHTML);
  var bx=document.getElementById('mBtns'); bx.innerHTML='';
  buttons.forEach(function(b){ var el=document.createElement('button'); el.type='button'; el.className='btn '+(b.cls||''); el.textContent=trHTML(b.t); el.addEventListener('click', function(){ modal.hidden=true; if(b.fn) b.fn(); }); bx.appendChild(el); });
  modal.hidden=false;
}
function askConfirm(msg, yes){ openModal('Confirmar','<p>'+esc(msg)+'</p>',[{t:'Cancelar',cls:'ghost'},{t:'Aceptar',fn:yes}]); }
modal.addEventListener('click', function(e){ if(e.target===modal) modal.hidden=true; });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') modal.hidden=true; });

/* ---------- Historial ---------- */
function saveToHistory(){
  var c=calcAll(S);
  if(!c.good.length){ toast('No hay resultados válidos para guardar'); return; }
  var h=histLoad();
  h.unshift({ id:Date.now().toString(36), ts:Date.now(), tag:S.meta.tag||'', fecha:S.meta.fecha, tipo:S.pump.tipo, clase:S.pump.clase, n:c.good.length, eta:c.etaAvg, snap:JSON.parse(JSON.stringify(S)) });
  store.set('ebp:hist', h.slice(0,60));
  toast('Guardado en el historial');
}

/* ---------- Informes y exportación ---------- */
function fname(ext){ return 'Eficiencia_'+((S.meta.tag||'bomba').replace(/[^\w\-]+/g,'_'))+'_'+(S.meta.fecha||today())+'.'+ext; }
function reportText(){
  var c=calcAll(S), fl=FLUIDS[S.fluid.preset]||FLUIDS.otro;
  var L=['EVALUACIÓN DE EFICIENCIA DE BOMBA','Empresa: '+(S.meta.empresa||'—'),'Equipo/TAG: '+(S.meta.tag||'—')+'   Fecha del ensayo: '+(fmtDate(S.meta.fecha)||'—'),'Servicio: '+(S.meta.ubic||'—')+'   Responsable: '+(S.meta.resp||'—'),
    'Tipo: '+TIPOS[S.pump.tipo]+' · '+CLASES[S.pump.clase]+(S.pump.tipo==='multi'?' · '+(S.pump.etapas||'?')+' etapas':''),
    'Fluido: '+fl.n+' · ρ '+f(S.fluid.rho,0)+' kg/m³ · ν '+f(S.fluid.visc,1)+' cSt · T '+f(S.fluid.T,0)+' °C','',
    'Pto | Q m³/h | H m | Ph kW | Pe kW | η bomba % | η global % | kWh/m³ | Desv pts | Estado'];
  c.pts.forEach(function(r,i){ if(r.ok) L.push((i+1)+' | '+f(r.Q,1)+' | '+f(r.H,1)+' | '+f(r.Ph,1)+' | '+f(r.Pe,1)+' | '+f(r.eta,1)+' | '+f(r.etaG,1)+' | '+f(r.Eesp,3)+' | '+(r.src!=='band'?fsg(r.dev,1):'n/a')+' | '+r.status.t); else L.push((i+1)+' | incompleto'); });
  if(c.good.length) L.push('','Promedio: η bomba '+f(c.etaAvg,1)+' % · η global '+f(c.etaGAvg,1)+' % · '+f(c.eespAvg,3)+' kWh/m³');
  vibText(c).forEach(function(x){ L.push(x); });
  L.push('','Método: hidráulico–eléctrico in situ. Resultado orientativo (no es ensayo de aceptación ISO 9906).','Normas de referencia: API 610 / ISO 13709, ISO 20816-3, ISO 9906, ANSI/HI 40.6, ANSI/HI 9.6.7.');
  return trHTML(L.join('\n'));
}
var DEC=(1.5).toLocaleString().indexOf(',')>=0 ? ',' : '.';
function cn(v,d){ return (v===null||v===undefined||!isFinite(v)) ? '' : Number(v).toFixed(d).replace('.',DEC); }
function buildCSV(){
  var sep = DEC===',' ? ';' : ',', c=calcAll(S);
  function q(s){ s=String(s===null||s===undefined?'':s); if(/^[=+\-@\t]/.test(s)) s="'"+s; return /[;,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
  var vh=[]; VIB_LOCS.forEach(function(L){ L[2].forEach(function(d){ vh.push('vib '+L[3]+' '+d.toUpperCase()+' (mm/s RMS)'); }); });
  var rows=[['Punto','Q (m3/h)','Ps (bar g)','Pd (bar g)','V','I','cos fi','kW directos','eta motor %','v asp (m/s)','v imp (m/s)','H (m)','P hidraulica (kW)','P electrica (kW)','P eje (kW)','eta bomba %','eta global %','kWh/m3','kWh/bbl','eta ref %','desv (pts)','incert (pts)','estado','observaciones'].concat(vh).concat(['vib max (mm/s)','zona vib','estado vib'])];
  c.pts.forEach(function(r,i){ var p=S.points[i], ev=c.vib[i]; if(!r.ok && !ev.n) return;
    var row = r.ok ? [i+1,cn(r.Q,2),cn(p.Ps,3),cn(p.Pd,3),cn(p.V,1),cn(p.I,1),cn(p.cos,3),cn(p.kW,1),cn(r.etaMp,1),cn(r.vs,2),cn(r.vd,2),cn(r.H,2),cn(r.Ph,2),cn(r.Pe,2),cn(r.Peje,2),cn(r.eta,2),cn(r.etaG,2),cn(r.Eesp,4),cn(r.EespBbl,4),r.src==='band'?'':cn(r.ref,2),r.src==='band'?'':cn(r.dev,2),cn(r.U,2),r.status.t,p.obs] : [i+1,'',cn(p.Ps,3),cn(p.Pd,3),cn(p.V,1),cn(p.I,1),cn(p.cos,3),cn(p.kW,1)].concat(new Array(14).fill('')).concat(['Incompleto',p.obs]);
    VIB_LOCS.forEach(function(L){ L[2].forEach(function(d){ row.push(cn(p.vib?p.vib[L[0]+'_'+d]:null,2)); }); });
    row.push(ev.worst?cn(ev.worst.v,2):'', ev.worst?ev.worst.z:'', ev.worst?vibVerdict(ev.worst.z).t:'');
    rows.push(row); });
  var head=['Empresa',S.meta.empresa,'Equipo/TAG',S.meta.tag,'Fecha del ensayo',fmtDate(S.meta.fecha),'Tipo',TIPOS[S.pump.tipo],'Potencia',CLASES[S.pump.clase],'Fluido',(FLUIDS[S.fluid.preset]||{}).n,'rho kg/m3',cn(S.fluid.rho,1),'visc cSt',cn(S.fluid.visc,2),'ISO 20816-3 grupo',(vibGroup(S)==='g1'?'1':'2'),'cimentacion',(S.pump.fund==='flex'?'flexible':'rigida')];
  return trHTML('\uFEFF'+(sep===';'?'sep=;\n':'')+[head].concat([[]],rows).map(function(r){ return r.map(q).join(sep); }).join('\n'));
}
function buildHTMLReport(){
  var c=calcAll(S), fl=FLUIDS[S.fluid.preset]||FLUIDS.otro;
  var rows=c.pts.map(function(r,i){ return r.ok?'<tr><td>'+(i+1)+'</td><td>'+f(r.Q,1)+'</td><td>'+f(r.H,1)+'</td><td>'+f(r.Ph,1)+'</td><td>'+f(r.Pe,1)+'</td><td><b>'+f(r.eta,1)+'</b></td><td>'+f(r.etaG,1)+'</td><td>'+f(r.Eesp,3)+'</td><td>'+(r.src!=='band'?fsg(r.dev,1):'—')+'</td><td>'+esc(trHTML(r.status.t))+'</td></tr>':''; }).join('');
  var html = '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Informe de eficiencia '+esc(S.meta.tag)+'</title><style>body{font:15px/1.4 Arial,sans-serif;margin:24px;color:#111}h1{font-size:22px;margin:0 0 4px}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #999;padding:5px 7px;text-align:right}th{background:#e6ecf0}td:first-child,th:first-child{text-align:left}.m{color:#444;font-size:13px}</style></head><body>'+
    '<h1>Evaluación de eficiencia de bomba</h1><div class="m">Método hidráulico–eléctrico in situ</div><p><b>Empresa:</b> '+esc(S.meta.empresa||'—')+' &nbsp; <b>Fecha del ensayo:</b> '+esc(fmtDate(S.meta.fecha)||'—')+'<br><b>Equipo/TAG:</b> '+esc(S.meta.tag||'—')+'<br><b>Servicio:</b> '+esc(S.meta.ubic||'—')+' &nbsp; <b>Responsable:</b> '+esc(S.meta.resp||'—')+'<br><b>Tipo:</b> '+TIPOS[S.pump.tipo]+' · '+CLASES[S.pump.clase]+'<br><b>Fluido:</b> '+esc(fl.n)+' · ρ '+f(S.fluid.rho,0)+' kg/m³ · ν '+f(S.fluid.visc,1)+' cSt · T '+f(S.fluid.T,0)+' °C</p>'+
    '<table><thead><tr><th>Punto</th><th>Q m³/h</th><th>H m</th><th>Ph kW</th><th>Pe kW</th><th>η bomba %</th><th>η global %</th><th>kWh/m³</th><th>Desv. pts</th><th>Estado</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    (c.good.length?'<p><b>Promedio:</b> η bomba '+f(c.etaAvg,1)+' % · η global '+f(c.etaGAvg,1)+' % · '+f(c.eespAvg,3)+' kWh/m³</p>':'')+vibReportHTML(c)+
    '<p class="m">Resultados orientativos; no sustituyen un ensayo de aceptación (ISO 9906, ANSI/HI 40.6) ni los ensayos de API 610 / ISO 13709.</p></body></html>';
  return trHTML(html);
}
function blobSave(o){
  return new Promise(function(res,rej){
    try{
      var type = /\.csv$/i.test(o.filename) ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8';
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([o.data],{type:type}));
      a.download = o.filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      res({status:'saved'});
    }catch(e){ rej({code:'unavailable'}); }
  });
}
async function saveFile(name, data){
  if(!DL){ toast('La descarga no está disponible aquí: use «Copiar resumen»'); return; }
  try{ await DL.save({ filename:name, data:data }); toast('Archivo listo'); }
  catch(e){ if(e && e.code==='declined') return; toast('No se pudo guardar el archivo'); }
}
function copyText(text){
  function fallback(){
    openModal('Resumen para copiar','<textarea id="cpTa" readonly></textarea><p class="hint">Mantenga pulsado el texto, elija «Seleccionar todo» y copie.</p>',[{t:'Cerrar',cls:'ghost'}]);
    var ta=document.getElementById('cpTa'); ta.value=text; ta.focus(); ta.select();
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast('Resumen copiado'); }, fallback); return; }
  }catch(e){}
  fallback();
}

applyTheme();

    window.claude.use('downloads').then(function(d){ DL=d||null; applyDL(); }, function(){ DL=null; });
  } else { DL = { save: blobSave }; applyDL(); }   // archivo abierto directamente (sin conexión)
}catch(e){ DL=null; }
if(!store.ok) setTimeout(function(){ toast('Este navegador no guarda datos: copie o descargue el resumen antes de cerrar'); }, 700);
